<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A" />
      <stop offset="50%" stop-color="#0C1426" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="cyanCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0066FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090E1A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#aiBg)" />

  <!-- Radial Core Glow -->
  <circle cx="400" cy="225" r="200" fill="url(#cyanCenter)" />

  <!-- Biometric HUD Radar Rings -->
  <circle cx="400" cy="225" r="170" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="400" cy="225" r="130" stroke="#00D4FF" stroke-opacity="0.2" stroke-width="1" />
  <circle cx="400" cy="225" r="90" stroke="#1E293B" stroke-width="1" />

  <!-- Outer HUD Corner Reticles -->
  <path d="M 60 90 L 60 60 L 90 60" stroke="#00D4FF" stroke-width="2" stroke-opacity="0.7" fill="none" />
  <path d="M 740 90 L 740 60 L 710 60" stroke="#00D4FF" stroke-width="2" stroke-opacity="0.7" fill="none" />
  <path d="M 60 360 L 60 390 L 90 390" stroke="#00D4FF" stroke-width="2" stroke-opacity="0.7" fill="none" />
  <path d="M 740 360 L 740 390 L 710 390" stroke="#00D4FF" stroke-width="2" stroke-opacity="0.7" fill="none" />

  <!-- Header Telemetry Info -->
  <text x="60" y="45" fill="#00D4FF" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">VISION-AI // REAL-TIME FACE RECOGNITION (ILLUSTRATIVE)</text>
  <text x="600" y="45" fill="#64748B" font-family="monospace" font-size="10" letter-spacing="1">ARCH: YOLOv8 + ArcFace</text>
  <line x1="60" y1="52" x2="740" y2="52" stroke="#1E293B" stroke-width="1" />

  <!-- YOLOv8 Primary Detection Bounding Box -->
  <rect x="280" y="100" width="240" height="250" rx="8" fill="#00D4FF" fill-opacity="0.04" stroke="#00D4FF" stroke-opacity="0.6" stroke-width="1.5" />
  
  <!-- YOLO Target Corner Brackets -->
  <path d="M 270 120 L 270 90 L 300 90" stroke="#00D4FF" stroke-width="3" fill="none" />
  <path d="M 530 120 L 530 90 L 500 90" stroke="#00D4FF" stroke-width="3" fill="none" />
  <path d="M 270 330 L 270 360 L 300 360" stroke="#00D4FF" stroke-width="3" fill="none" />
  <path d="M 530 330 L 530 360 L 500 360" stroke="#00D4FF" stroke-width="3" fill="none" />

  <!-- Bounding Box Header Tag -->
  <rect x="280" y="75" width="165" height="20" rx="4" fill="#00D4FF" />
  <text x="290" y="89" fill="#0A0E1A" font-family="monospace" font-size="10" font-weight="bold">TARGET #01: VERIFIED</text>

  <!-- ArcFace Biometric Facial Mesh (Geometric Wireframe Nodes) -->
  <!-- Forehead & Eyebrow Nodes -->
  <line x1="360" y1="160" x2="400" y2="150" stroke="#00D4FF" stroke-opacity="0.5" stroke-width="1.2" />
  <line x1="400" y1="150" x2="440" y2="160" stroke="#00D4FF" stroke-opacity="0.5" stroke-width="1.2" />
  <line x1="360" y1="160" x2="350" y2="185" stroke="#00D4FF" stroke-opacity="0.5" stroke-width="1" />
  <line x1="440" y1="160" x2="450" y2="185" stroke="#00D4FF" stroke-opacity="0.5" stroke-width="1" />

  <!-- Eyes Landmarks -->
  <ellipse cx="365" cy="185" rx="14" ry="7" stroke="#00D4FF" stroke-width="1.2" fill="none" />
  <circle cx="365" cy="185" r="3" fill="#00D4FF" />

  <ellipse cx="435" cy="185" rx="14" ry="7" stroke="#00D4FF" stroke-width="1.2" fill="none" />
  <circle cx="435" cy="185" r="3" fill="#00D4FF" />

  <!-- Nose Bridge & Tip -->
  <line x1="400" y1="150" x2="400" y2="225" stroke="#00D4FF" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="3 3" />
  <polygon points="400,205 390,230 410,230" stroke="#00D4FF" stroke-opacity="0.7" stroke-width="1" fill="#00D4FF" fill-opacity="0.15" />

  <!-- Cheeks & Facial Contour Vectors -->
  <line x1="350" y1="185" x2="340" y2="240" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="1" />
  <line x1="450" y1="185" x2="460" y2="240" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="1" />
  <line x1="340" y1="240" x2="365" y2="295" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="1" />
  <line x1="460" y1="240" x2="435" y2="295" stroke="#00D4FF" stroke-opacity="0.4" stroke-width="1" />
  <line x1="365" y1="295" x2="400" y2="315" stroke="#00D4FF" stroke-opacity="0.6" stroke-width="1.5" />
  <line x1="435" y1="295" x2="400" y2="315" stroke="#00D4FF" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Mouth & Jaw Landmarks -->
  <polygon points="380,265 400,260 420,265 400,278" stroke="#00D4FF" stroke-opacity="0.6" stroke-width="1" fill="none" />
  <circle cx="380" cy="265" r="2.5" fill="#00D4FF" />
  <circle cx="420" cy="265" r="2.5" fill="#00D4FF" />
  <circle cx="400" cy="278" r="2.5" fill="#00D4FF" />

  <!-- Feature Points Clusters (ArcFace high-dim embeddings) -->
  <circle cx="340" cy="240" r="3" fill="#00D4FF" />
  <circle cx="460" cy="240" r="3" fill="#00D4FF" />
  <circle cx="365" cy="295" r="3" fill="#00D4FF" />
  <circle cx="435" cy="295" r="3" fill="#00D4FF" />
  <circle cx="400" cy="315" r="4" fill="#00D4FF" />

  <!-- Sweeping Scanning Laser -->
  <line x1="280" y1="220" x2="520" y2="220" stroke="#00D4FF" stroke-width="2" opacity="0.9" filter="drop-shadow(0 0 8px #00D4FF)" />

  <!-- Left Telemetry Box: Anti-Spoofing & Liveness -->
  <rect x="70" y="130" width="180" height="190" rx="8" fill="#0E1628" fill-opacity="0.8" stroke="#1E293B" stroke-width="1" />
  <text x="85" y="155" fill="#00D4FF" font-family="monospace" font-size="10" font-weight="bold">ANTI-SPOOFING METRICS</text>

  <text x="85" y="185" fill="#64748B" font-family="monospace" font-size="9">TEXTURE ANALYSIS:</text>
  <text x="85" y="200" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold">● LIVE HUMAN</text>

  <text x="85" y="230" fill="#64748B" font-family="monospace" font-size="9">DEPTH VALIDATION:</text>
  <text x="85" y="245" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold">● 3D MESH OK</text>

  <text x="85" y="275" fill="#64748B" font-family="monospace" font-size="9">SPOOF ATTACK CHECK:</text>
  <text x="85" y="290" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold">● ZERO SPOOF RISK</text>

  <!-- Right Telemetry Box: Attendance Log -->
  <rect x="550" y="130" width="180" height="190" rx="8" fill="#0E1628" fill-opacity="0.8" stroke="#1E293B" stroke-width="1" />
  <text x="565" y="155" fill="#00D4FF" font-family="monospace" font-size="10" font-weight="bold">ATTENDANCE LOG</text>

  <text x="565" y="185" fill="#64748B" font-family="monospace" font-size="9">MATCH CONFIDENCE:</text>
  <text x="565" y="200" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="bold">HIGH CONFIDENCE</text>

  <text x="565" y="230" fill="#64748B" font-family="monospace" font-size="9">FRAME RATE:</text>
  <text x="565" y="245" fill="#00D4FF" font-family="monospace" font-size="11" font-weight="bold">30 FPS (REAL-TIME)</text>

  <text x="565" y="275" fill="#64748B" font-family="monospace" font-size="9">STATUS:</text>
  <rect x="565" y="285" width="145" height="22" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
  <text x="575" y="300" fill="#10B981" font-family="monospace" font-size="9.5" font-weight="bold">✓ ATTENDANCE LOGGED</text>

  <!-- Footer Info Line -->
  <text x="400" y="420" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">CONCEPT VISUALIZATION // SINTA 3 RESEARCH PUBLICATION DOI: 10.30865/jurikom.v13i1.9502</text>
</svg>
