<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0A0E1A" />
  <polygon points="50,15 82,35 82,68 50,85 18,68 18,35" fill="none" stroke="url(#cyan-grad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="50" cy="50" r="12" fill="#00D4FF" filter="url(#glow)" />
</svg>
